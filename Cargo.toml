[package]
name = "fluid-toy"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "27"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1.14", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
image = { version = "0.25", features = ["hdr"] }
half = "2.4"
gltf = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# GUI
egui = "0.33"
egui-wgpu = "0.33"
egui-winit = "0.33"

[lints.clippy]
# Long functions are how the big files grew: a new pass, phase or panel gets
# its own function or module. Threshold in clippy.toml; functions that were
# already over it carry #[allow(clippy::too_many_lines)].
too_many_lines = "warn"
